name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/pulse_test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/pulse_test
      SESSION_SECRET: ci-test-session-secret
      NEXT_PUBLIC_API_URL: http://localhost:3001

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run backend migrations
        run: npm run db:migrate -w backend

      - name: Run backend tests
        run: npm run test -w backend

      - name: Build backend
        run: npm run build -w backend

      - name: Build frontend
        run: npm run build -w frontend

      - name: Build backend Docker image
        # Validates backend/Dockerfile actually builds -- it was written without
        # Docker available in the dev environment, so this is its only real check.
        run: docker build -f backend/Dockerfile -t exvade-pulse-backend:ci .
